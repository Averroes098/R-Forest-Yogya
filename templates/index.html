<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Harga Rumah Yogyakarta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #1a2a3a;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9f7e1;
            border-left: 5px solid #27ae60;
            border-radius: 5px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .error {
            background-color: #f8d7da;
            border-left-color: #e74c3c;
            color: #721c24;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏠 Prediksi Harga Rumah Yogyakarta</h1>
    <form method="POST" action="/predict" id="predictionForm">
        <label>Luas Tanah (m²)</label>
        <input type="number" step="any" name="landSize" required>

        <label>Luas Bangunan (m²)</label>
        <input type="number" step="any" name="buildingSize" required>

        <label>Jumlah Kamar Tidur</label>
        <input type="number" step="any" name="bedrooms" required>

        <label>Jumlah Kamar Mandi</label>
        <input type="number" step="any" name="bathrooms" required>

        <label>Jumlah Lantai</label>
        <input type="number" step="any" name="floors" required>

        <label>Jumlah Garasi</label>
        <input type="number" step="any" name="garages" required>

        <label>Daya Listrik (Watt)</label>
        <input type="number" step="any" name="electricity" required>

        <label>Kota (City)</label>
        <select name="city" id="citySelect" required>
            <option value="">-- Pilih Kota --</option>
            {% for c in cities %}
            <option value="{{ c }}" {% if city_selected == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select>

        <label>Kecamatan (District)</label>
        <select name="district" id="districtSelect" required>
            <option value="">-- Pilih Kota Terlebih Dahulu --</option>
        </select>

        <label>Perabotan</label>
        <select name="furnishing" required>
            {% for value, label in furnishing_options %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>

        <button type="submit">Prediksi Harga</button>
    </form>

    {% if prediction %}
    <div class="result">
        🎉 Perkiraan Harga: {{ prediction }}
    </div>
    {% endif %}

    {% if error %}
    <div class="result error">
        ⚠️ Error: {{ error }}
    </div>
    {% endif %}

    <footer>
        Model Random Forest | Akurasi R² ~0.85
    </footer>
</div>

<script>
    // Ambil elemen dropdown
    const citySelect = document.getElementById('citySelect');
    const districtSelect = document.getElementById('districtSelect');

    // Fungsi untuk mengambil kecamatan dari server
    async function loadDistricts(city) {
        if (!city) {
            districtSelect.innerHTML = '<option value="">-- Pilih Kota Terlebih Dahulu --</option>';
            districtSelect.disabled = true;
            return;
        }

        // Tampilkan loading
        districtSelect.innerHTML = '<option value="">Memuat kecamatan...</option>';
        districtSelect.disabled = true;

        try {
            const response = await fetch(`/get_districts/${encodeURIComponent(city)}`);
            const districts = await response.json();

            // Reset dropdown kecamatan
            districtSelect.innerHTML = '<option value="">-- Pilih Kecamatan --</option>';
            if (districts.length === 0) {
                districtSelect.innerHTML += '<option value="" disabled>Tidak ada kecamatan</option>';
            } else {
                districts.forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            }
            districtSelect.disabled = false;
        } catch (error) {
            console.error('Gagal memuat kecamatan:', error);
            districtSelect.innerHTML = '<option value="">Gagal memuat data</option>';
            districtSelect.disabled = true;
        }
    }

    // Event ketika kota berubah
    citySelect.addEventListener('change', (e) => {
        loadDistricts(e.target.value);
    });

    // Jika halaman dimuat dengan city sudah dipilih (misalnya setelah prediksi error atau sukses)
    window.addEventListener('DOMContentLoaded', () => {
        const selectedCity = citySelect.value;
        if (selectedCity) {
            loadDistricts(selectedCity);
        }
    });
</script>
</body>
</html>
